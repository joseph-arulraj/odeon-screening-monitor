name: Odeon showtime monitor

on:
  schedule:
    # GitHub scheduled workflows use UTC. Runs every five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odeon-showtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll Odeon and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODEON_BEARER_TOKEN: ${{ secrets.ODEON_BEARER_TOKEN }}
        run: python monitor.py

      - name: Persist detection state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update detected Odeon showtimes"
            git push
          fi
